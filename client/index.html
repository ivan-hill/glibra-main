    <!-- JSON-LD: Organization -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Organization",
      "name": "Glibra",
      "url": "https://onboarding.glibra.com",
      "logo": "https://onboarding.glibra.com/favicon.png",
      "description": "Glibra helps independent hosts, restaurants, wineries, farms, tour guides, photographers, transportation providers, and local experience operators become part of coordinated travel bundles for the Finger Lakes and Upstate New York.",
      "address": {
        "@type": "PostalAddress",
        "addressLocality": "Geneva",
        "addressRegion": "NY",
        "addressCountry": "US"
      },
      "contactPoint": {
        "@type": "ContactPoint",

        "contactType": "Business Inquiries"
      },

    <!-- JSON-LD: LocalBusiness / TravelAgency -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "TravelAgency",
      "name": "Glibra",
      "url": "https://onboarding.glibra.com",
      "description": "AI-powered regional travel coordination platform connecting local Finger Lakes providers with travelers through bundled trip experiences.",
      "address": {
        "@type": "PostalAddress",
        "addressLocality": "Geneva",
        "addressRegion": "NY",
        "addressCountry": "US"
      },
      "serviceArea": {
        "@type": "Place",
        "name": "Finger Lakes Region, Upstate New York"
      },
      "hasOfferCatalog": {
        "@type": "OfferCatalog",
        "name": "Provider Categories",
        "itemListElement": [
          { "@type": "Offer", "itemOffered": { "@type": "Service", "name": "Short-term rental and boutique lodging listing" } },
          { "@type": "Offer", "itemOffered": { "@type": "Service", "name": "Restaurant and dining coordination" } },
          { "@type": "Offer", "itemOffered": { "@type": "Service", "name": "Winery and farm experience listing" } },
          { "@type": "Offer", "itemOffered": { "@type": "Service", "name": "Tour guide and local experience listing" } },
          { "@type": "Offer", "itemOffered": { "@type": "Service", "name": "Transportation provider coordination" } },
          { "@type": "Offer", "itemOffered": { "@type": "Service", "name": "Photography service listing" } },
          { "@type": "Offer", "itemOffered": { "@type": "Service", "name": "Wellness and outdoor activity coordination" } }
        ]
      }
    }
    </script>

    <!-- JSON-LD: Service -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Service",
      "name": "Glibra Provider Network",
      "provider": { "@type": "Organization", "name": "Glibra" },
      "description": "Join Glibra as a local provider and become part of coordinated Finger Lakes travel bundles. Glibra connects lodging, dining, transportation, wineries, farms, guides, and experience operators into cohesive trip plans for travelers.",
      "serviceType": "Travel Coordination Platform",
      "areaServed": "Finger Lakes, Upstate New York"
    }
    </script>

    <!-- JSON-LD: FAQPage -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "FAQPage",
      "mainEntity": [
        {
          "@type": "Question",
          "name": "Who can join Glibra?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Glibra is designed for hosts, restaurants, wineries, farms, guides, photographers, transportation providers, and local experience operators who want to participate in coordinated regional travel bundles."
          }
        },
        {
          "@type": "Question",
          "name": "Does Glibra replace my existing booking system?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "No. Glibra is a coordination layer that helps travelers discover and organize local providers as part of a connected trip plan."
          }
        },
        {
          "@type": "Question",
          "name": "Does Glibra guarantee bookings?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "No. Glibra helps improve discovery and coordination, but individual bookings depend on provider availability and traveler demand."
          }
        },
        {
          "@type": "Question",
          "name": "What happens if a provider becomes unavailable?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Glibra helps travelers adjust their plan by surfacing possible backup options or revised itinerary paths where available."
          }
        },
        {
          "@type": "Question",
          "name": "Is Glibra an insurance product?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "No. Glibra is not travel insurance and does not provide claim-based coverage, reimbursement, or insured protection. Glibra provides coordination assistance and fallback planning."
          }
        },
        {
          "@type": "Question",
          "name": "What is the Finger Lakes pilot program?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Glibra is launching its first regional network in the Finger Lakes, Upstate New York. Local providers in this region can apply now to be included in coordinated travel bundles during the pilot."
          }
        }
      ]
    }
    </script>
